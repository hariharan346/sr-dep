version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: raise2solve-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - raise2solve-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raise2solve-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/raise2solve
      - JWT_SECRET=super_secret_dev_jwt_key_12345
      - FRONTEND_URL=http://localhost:8080
    depends_on:
      - mongodb
    networks:
      - raise2solve-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raise2solve-frontend
    ports:
      - "8080:80"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - raise2solve-network

networks:
  raise2solve-network:
    driver: bridge

volumes:
  mongo-data:
