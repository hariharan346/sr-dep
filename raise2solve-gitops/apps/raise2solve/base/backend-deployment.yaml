apiVersion: v1
kind: ServiceAccount
metadata:
  name: raise2solve-backend-sa
  namespace: raise2solve
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/raise2solve-backend-s3-role-dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: raise2solve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: raise2solve-backend-sa
      containers:
      - name: backend
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/raise2solve/backend:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: raise2solve-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: raise2solve-secret
              key: JWT_SECRET
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
