apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/backend-deployment.yaml
  - ../../base/backend-service.yaml
  - ../../base/frontend-deployment.yaml
  - ../../base/frontend-service.yaml
  - ../../base/ingress.yaml
  - ../../base/configmap.yaml
  - ../../base/hpa.yaml

patches:
  - target:
      kind: ConfigMap
      name: raise2solve-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_URL
        value: http://dev.yourdomain.com
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
