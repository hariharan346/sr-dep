apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: raise2solve-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/raise2solve-gitops.git'
    targetRevision: HEAD
    path: apps/raise2solve/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: raise2solve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
